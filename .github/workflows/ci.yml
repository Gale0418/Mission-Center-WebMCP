name: Challenge CI and Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: JavaScript syntax
        run: |
          node --check assets/core.js
          node --check assets/webmcp.js
          node --check assets/app.js
      - name: Unit tests
        run: npm test
      - name: Submission verification
        run: npm run verify

  cleanup-temporary-branches:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Delete every non-main construction branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            'build/webmcp-challenge'
            'codex/release-asset-staging'
            'codex/tree-upload-test'
            'codex/tree-upload-test-2'
            'codex/tree-upload-test-3'
            'codex/tree-upload-test-4'
            'codex/tree-upload-test-5'
            'codex/tree-upload-test-6'
            'codex/webmcp-competition-flight'
            'codex/webmcp-competition-flight-backup'
            'codex/webmcp-competition-flight-pr'
            'codex/webmcp-competition-flight-review'
          )
          for branch in "${branches[@]}"; do
            code=$(curl --silent --show-error --output /tmp/delete-ref.json --write-out '%{http_code}' \
              --request DELETE \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${REPOSITORY}/git/refs/heads/${branch}")
            if [[ "$code" != '204' && "$code" != '404' && "$code" != '422' ]]; then
              cat /tmp/delete-ref.json
              echo "Failed to delete ${branch}: HTTP ${code}" >&2
              exit 1
            fi
          done

  deploy:
    if: ${{ github.event.repository.has_pages == true }}
    needs: verify
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Build minimal static artifact
        run: npm run build:site
      - name: Upload static site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
